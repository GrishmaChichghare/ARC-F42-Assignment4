<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="instagram.css">
    <title>Instagram</title>
</head>
<body>
    <section class="main-cont">
        <nav class="navbar">
            <div class="logo">
                <img src="assets/images/instagramlogo.png" alt="logo">
                <h2>Instagram</h2>
            </div>

            <ul class="menu">
                <li>Services</li>
                <li>Pricing</li>
                <li>Contacts</li>
                <li class="search-icon">
                    <img src="assets/images/Search.png" alt="icon">
                </li>
            </ul>
        </nav>

        <div class="container">
            <h1>Instagram Story Viewer and Downloader</h1>
            <p>
                Best Instagram story viewer! You can watch Instagram stories anonymously
                and quickly without the need to log in.
            </p>

            <div class="search-box">
                <input type="text" placeholder="Enter Instagram username">
                <button>Search</button>
            </div>
        </div>

    </section>

    <section class="features">
        <div class="feature">
            <div class="icon-box">
                <img src="assets/images/no need.png">
            </div>
            <h3>No Need Instagram Account</h3>
        </div>

        <div class="feature">
            <div class="icon-box lock">
                <img src="assets/images/locks.png">
            </div>
            <h3>Anonymous</h3>
        </div>

        <div class="feature">
            <div class="icon-box cloud">
                <img src="assets/images/share.png">
            </div>
            <h3>Download and Share</h3>
        </div>
    </section>

</body>
</html>
