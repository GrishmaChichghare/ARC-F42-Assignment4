<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ColorPalette.css">
    <title>Color Palette</title>
</head>
<body>
    <div class="main-cont">

        <h1>Color Palette</h1>
        <div class="palette">
            <div class="card red">
                <h3>Red</h3>
                <p>#f87171</p>
            </div>

            <div class="card orange">
                <h3>Orange</h3>
                <p>#fb923c</p>
            </div>

            <div class="card amber">
                <h3>Amber</h3>
                <p>#fbbf24</p>
            </div>

            <div class="card yellow">
                <h3>Yellow</h3>
                <p>#facc15</p>
            </div>

            <div class="card lime">
                <h3>Lime</h3>
                <p>#a3e635</p>
            </div>

            <div class="card green">
                <h3>Green</h3>
                <p>#4ade80</p>
            </div>

            <div class="card emerald">
                <h3>Emerald</h3>
                <p>#34d399</p>
            </div>

            <div class="card cyan">
                <h3>Cyan</h3>
                <p>#22d3ee</p>
            </div>

            <div class="card lightblue">
                <h3>Light Blue</h3>
                <p>#38bdf8</p>
            </div>

            <div class="card blue">
                <h3>Blue</h3>
                <p>#60a5fa</p>
            </div>

            <div class="card indigo">
                <h3>Indigo</h3>
                <p>#818cf8</p>
            </div>

            <div class="card purple">
                <h3>Purple</h3>
                <p>#c084fc</p>
            </div>

            <div class="card fuchsia">
                <h3>Fuchsia</h3>
                <p>#e879f9</p>
            </div>

            <div class="card pink">
                <h3>Pink</h3>
                <p>#f472b6</p>
            </div>

            <div class="card rose">
                <h3>Rose</h3>
                <p>#fb7185</p>
            </div>
        </div>
    </div>
</body>
</html>
